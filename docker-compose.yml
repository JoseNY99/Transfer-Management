services:
  postgres:
    image: postgres:16
    container_name: payments-postgres
    environment:
      POSTGRES_DB: paymentsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: payments-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: payments-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      cub kafka-ready -b kafka:9092 1 60 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic risk-evaluation-request --partitions 1 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic risk-evaluation-response --partitions 1 --replication-factor 1 &&
      echo 'Kafka topics created'
      "

  payments-api:
    build:
      context: .
      dockerfile: docker/payments-api.Dockerfile
    container_name: payments-api
    depends_on:
      - postgres
      - kafka
      - kafka-init
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8080:8080"

  risk-worker:
    build:
      context: .
      dockerfile: docker/risk-worker.Dockerfile
    container_name: risk-worker
    depends_on:
      - postgres
      - kafka
      - kafka-init
    environment:
      DOTNET_ENVIRONMENT: Docker

volumes:
  postgres_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log: